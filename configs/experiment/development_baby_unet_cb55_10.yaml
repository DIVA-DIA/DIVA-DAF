# @package _global_

defaults:
    - /mode: development.yaml
    - trainer: default_trainer.yaml
    - /plugins: null
    - /task: semantic_segmentation_HisDB_cropped.yaml
    - /loss: crossentropyloss.yaml
    - /metric:
        - hisdbiou.yaml
        - precision.yaml
        - recall.yaml
        - f1_score_class_wise.yaml
    - /model/backbone: baby_unet.yaml
    - /model/header: unet_segmentation.yaml
    - datamodule: cb55_10_cropped_datamodule.yaml
    - /optimizer: adam.yaml
    - /callbacks:
          - check_compatibility.yaml
          - model_checkpoint.yaml
          - watch_model_wandb.yaml
          - time_tracker.yaml
    - /logger:
          - wandb.yaml
          - csv.yaml
    - _self_

name: "Development-Baby-UNet-on-HisDB-Cropped"

seed: 42

train: True
test: True
predict: False

model:
    header:
        features: 32

callbacks:
    model_checkpoint:
        filename: ${checkpoint_folder_name}dev-baby-unet-cb55-10
    watch_model:
        log_freq: 1

logger:
    wandb:
        project: dev
        name: 'dev-baby-unet-cb55-10'
        tags: [ "best_model", "USL" ]
        group: 'dev-runs'
        notes: "Testing"
