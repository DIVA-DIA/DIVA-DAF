# @package _global_

defaults:
    - /mode: experiment.yaml
    - /plugins: null
    - /task: semantic_segmentation_HisDB_cropped.yaml
    - /loss: crossentropyloss.yaml
    - /metric:
          - hisdbiou.yaml
          - precision.yaml
          - recall.yaml
          - f1_score.yaml
    - /model/backbone: unet.yaml
    - /model/header: unet_segmentation.yaml
    - /optimizer: adam.yaml
    - /callbacks:
          - time_tracker.yaml
          - check_compatibility.yaml
          - model_checkpoint.yaml
          - watch_model_wandb.yaml
    - /logger:
          - wandb.yaml # set logger here or use command line (e.g. `python run.py logger=wandb`)
          - csv.yaml
    - _self_


name: "time_tracking_hisdb_cropped_unet"

train: True
test: False
predict: False

trainer:
    _target_: pytorch_lightning.Trainer

    accelerator: 'gpu'
    devices: [0]
    strategy: 'ddp_find_unused_parameters_false'
    min_epochs: 1
    max_epochs: 10
    precision: 32
    check_val_every_n_epoch: 1

task:
    confusion_matrix_val: False
    confusion_matrix_test: False

datamodule:
    _target_: src.datamodules.DivaHisDB.datamodule_cropped.DivaHisDBDataModuleCropped

    data_dir: /net/research-hisdoc/datasets/semantic_segmentation/datasets_cropped/CB55
    crop_size: 256
    num_workers: 4
    batch_size: 16
    shuffle: True
    data_folder_name: data
    gt_folder_name: gt


optimizer:
    lr: 1e-3
    betas: [0.9, 0.999]
    eps: 1e-5

callbacks:
    model_checkpoint:
        monitor: "val/accuracy"
        mode: "max"
        filename: ${checkpoint_folder_name}_${name}

logger:
    wandb:
        project: "time_tracking_thesis"
        name: ${name}
        tags: ["unet", "hisdb", "patch", "time_tacking"]
        group: 'time_tracking'
